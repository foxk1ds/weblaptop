[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weblaptop"
version = "0.1.0"
description = "Native autonomous terminal CLI AI agent for Arch Linux"
readme = "README.md"
authors = [{ name = "foxkids" }]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40",
    "requests>=2.31.0",
]

[project.scripts]
weblaptop = "weblaptop.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["weblaptop*"]
